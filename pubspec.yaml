name: psold
description: "Psold - Products on Sale Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.3.0
  flutter_animate: ^4.5.0
  go_router: ^14.0.0
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  geolocator: ^11.0.0
  video_player: ^2.8.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.0
  url_launcher: ^6.2.0
  hive_flutter: ^1.1.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  lottie: ^3.0.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  sentry: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  generate: true
